# CampusBite site. Placeholders are filled in by deploy/server-setup.sh.
# Student app at /, kitchen app at /kitchen/, admin at /admin/, API and WebSocket at /v1/.
server {
    listen __PORT__ default_server;
    listen [::]:__PORT__ default_server;
    server_name __SERVER_NAME__;
    root __WEB_ROOT__;
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    include __HEADERS__;

    location = /v1/realtime {
        proxy_pass http://__API__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    location ~ ^/(v1/|health$|docs$|openapi\.json$) {
        proxy_pass http://__API__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change: cache them hard. index.html is never cached.
    # (A location with its own add_header drops the server-level ones, hence the includes.)
    location ~ /_expo/static/|/admin/assets/ {
        expires 30d;
        include __HEADERS__;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /kitchen/ {
        include __HEADERS__;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /kitchen/index.html;
    }

    location /admin/ {
        include __HEADERS__;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        include __HEADERS__;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
